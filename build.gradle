plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'ever.green.chat'
version = '26.6.1'
archivesBaseName = 'EvergreenChat'

java {
    toolchain {
        // Updated to Java 25 for Minecraft 26.1.2
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://nexus.scarsz.me/content/groups/public/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
    maven { url = 'https://m2.dv8tion.net/releases' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // Modern Paper API 26.1.2 build resolution
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'

    // Dependencies
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'com.discordsrv:discordsrv:1.30.1'
    compileOnly 'com.github.TechFortress:GriefPrevention:17.0.0'
    compileOnly files('libs/mcMMO.jar')
    compileOnly 'net.dv8tion:JDA:4.4.0_352'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.2.17'
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

shadowJar {
    archiveClassifier.set('')
}

build.dependsOn shadowJar